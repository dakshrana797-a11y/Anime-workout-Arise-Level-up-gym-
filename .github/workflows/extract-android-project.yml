name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android Studio project
        run: |
          set -e
          test -f Arise_Hunter_Android_Studio_Project.zip
          unzip -o Arise_Hunter_Android_Studio_Project.zip -d source
          SETTINGS_FILE=$(find source -type f -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find settings.gradle in the project ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          mkdir -p android-project
          cp -a "$PROJECT_DIR"/. android-project/

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-project
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
          else
            git commit -m "Extract Android Studio project source"
            git push
          fi
